<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#a90f13">
  <link rel="manifest" href="/manifest.json">
  <title>K.E. Chicharrón | Menú</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="menu">
  <header class="site-header">
    <div class="brand-mark"><img src="/incono.jpg" alt="K.E. Chicharrón"><div><span>K.E.</span><strong>CHICHARRÓN</strong><small>Dilan Ortega</small></div></div>
    <button class="cart-button" id="open-cart" aria-label="Abrir pedido"><span id="cart-count">0</span> Mi pedido</button>
  </header>
  <main>
    <section class="hero-menu">
      <div class="hero-copy"><p class="eyebrow">Sabor que se nota</p><h1>Elige tu antojo,<br><em>nosotros lo preparamos.</em></h1><p>Ordena desde tu mesa y disfruta comida recién hecha.</p></div>
      <img src="/WhatsApp%20Image%202026-09-11%20at%2023.58.43.jpeg" alt="Menú de K.E. Chicharrón">
    </section>
    <nav class="category-tabs" id="category-tabs" aria-label="Categorías"></nav>
    <section class="menu-grid" id="menu-grid"></section>
  </main>
  <aside class="drawer" id="cart-drawer" aria-hidden="true">
    <div class="drawer-head"><div><p class="eyebrow">Tu selección</p><h2>Mi pedido</h2></div><button class="icon-button" id="close-cart" aria-label="Cerrar pedido">×</button></div>
    <div id="cart-items" class="cart-items"></div>
    <div class="cart-footer"><div class="total-line"><span>Total</span><strong id="cart-total">$0</strong></div><button class="primary-button" id="checkout-button">Continuar con el pedido</button></div>
  </aside>
  <div class="modal-backdrop" id="checkout-modal" hidden><section class="checkout-modal"><button class="icon-button modal-close" id="close-checkout" aria-label="Cerrar">×</button><p class="eyebrow">Último paso</p><h2>¿Dónde te llevamos el pedido?</h2><p class="muted">Indica la mesa y cocina lo recibirá de inmediato.</p><form id="order-form"><label>Número de mesa<input id="table-number" inputmode="numeric" placeholder="Ej. 4" required></label><label>Nota para cocina <span>(opcional)</span><textarea id="order-note" rows="3" placeholder="Sin cebolla, salsa aparte..."></textarea></label><button class="primary-button" type="submit">Enviar pedido a cocina</button></form></section></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
